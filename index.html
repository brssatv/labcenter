<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LabCenter | Lab Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>

  <main id="auth-screen" class="auth-wrap">
    <section class="auth-card">
      <p class="badge">Workspace</p>
      <h1>Welcome to LabCenter</h1>
      <p class="subtle">Secure access</p>
      <form id="login-form" class="form-grid">
        <div class="auth-mode-switch" role="tablist" aria-label="Authentication mode">
          <button type="button" class="auth-mode-btn active" data-auth-mode="doctor">Doctor Login</button>
          <button type="button" class="auth-mode-btn" data-auth-mode="client">Client Portal Login</button>
        </div>
        <label id="doctor-email-wrap">
          <span>Doctor Email</span>
          <input type="email" id="doctor-email" placeholder="admin@clinic.local" autocomplete="username">
        </label>
        <label id="client-username-wrap" class="hidden">
          <span>Portal Username</span>
          <input type="text" id="client-username" placeholder="Enter portal username" autocomplete="username">
        </label>
        <label>
          <span>Password</span>
          <input type="password" id="doctor-password" placeholder="Enter password" autocomplete="current-password">
        </label>
        <button type="submit" class="btn-primary">Sign In</button>
      </form>
      <p id="login-error" class="error" aria-live="polite"></p>
      <p class="hint">Use your assigned credentials. Sessions expire automatically after inactivity.</p>
    </section>
  </main>

  <section id="app-shell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand">
        <p class="badge">LabCenter</p>
        <h2>Navigation</h2>
      </div>
      <nav id="side-nav" class="side-nav"></nav>
      <button id="logout-btn" class="btn-ghost" type="button">Logout</button>
    </aside>

    <section class="content">
      <header id="panel-header" class="topbar">
        <div>
          <h2 id="panel-title">Dashboard</h2>
          <p id="panel-subtitle" class="subtle">Overview of your workspace.</p>
        </div>
      </header>

      <section id="panel-body" class="card starter-card"></section>
    </section>
  </section>

  <script src="app.js"></script>
</body>
</html>
